<div class="education-entry">
    <div class="school-info">
        <b class="jetbrains-mono-bold orange">{{ ($.Get "school") }}</b>
        <p class="education-duration jetbrains-mono">({{ ($.Get "duration") }})</p>
    </div>
    
    <i class="education-degree jetbrains-mono-italic">{{ ($.Get "degree") }}</i>
    <div class="education-description">
        {{.Inner | .Page.RenderString}}
    </div>
    
</div>
